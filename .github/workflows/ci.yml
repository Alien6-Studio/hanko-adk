name: CI
on:
  push:
    branches:
      - main
  pull_request: null
  workflow_dispatch: null
  workflow_call:
    inputs:
      ref:
        description: Exact source ref selected by a release workflow
        type: string
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: adk-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true
jobs:
  typescript:
    name: TypeScript Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node:
          - "22"
          - "24"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
  checks:
    name: ADK checks
    if: always()
    needs:
      - typescript
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          TYPESCRIPT_RESULT: ${{ needs.typescript.result }}
        run: test "$TYPESCRIPT_RESULT" = success
