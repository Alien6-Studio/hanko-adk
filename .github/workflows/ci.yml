name: CI
on:
  push:
    branches:
      - main
  pull_request: null
  workflow_dispatch: null
  workflow_call: null
permissions:
  contents: read
concurrency:
  group: adk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  typescript:
    name: TypeScript Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node:
          - "22"
          - "24"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - name: Install and import the actual npm archive
        run: |
          archive="$(npm pack --pack-destination "$RUNNER_TEMP" --json | node -e 'let input=""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(input)[0].filename));')"
          npm install --prefix "$RUNNER_TEMP/consumer" --ignore-scripts --no-audit "$RUNNER_TEMP/$archive"
          printf '%s\n' 'import { normalizeHankoIssuer } from "@alien6/hankoshell-typescript-adk";' 'if (normalizeHankoIssuer("https://auth.example.test/") !== "https://auth.example.test") throw new Error("packaged import failed");' > "$RUNNER_TEMP/consumer/check.mjs"
          node "$RUNNER_TEMP/consumer/check.mjs"
  checks:
    name: ADK checks
    if: always()
    needs:
      - typescript
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          TYPESCRIPT_RESULT: ${{ needs.typescript.result }}
        run: test "$TYPESCRIPT_RESULT" = success
